[project]
name = "agent-engine"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.29",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "anthropic>=0.34",
]

[project.optional-dependencies]
openai = ["openai>=1.30"]
voyage = ["voyageai>=0.2"]
groq = ["groq>=0.11"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
